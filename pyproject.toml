[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vietlearn-agent"
version = "0.1.0"
description = "Adaptive Vietnamese learning assistant for English-language technology courses"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.0,<3.0",
  "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pyyaml>=6.0,<7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_server"]
